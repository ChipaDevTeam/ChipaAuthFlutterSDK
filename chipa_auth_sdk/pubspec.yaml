name: chipa_auth_flutter
description: Flutter SDK for ChipaAuth — drop-in authentication widget. No Firebase needed.
version: 1.0.0
homepage: https://github.com/chipatrade/chipa_auth_flutter

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.2.0
  app_links: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
